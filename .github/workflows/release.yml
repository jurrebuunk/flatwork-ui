name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p dist

          nix build .#css-vars --out-link result-css-vars
          cp -L result-css-vars dist/flatwork-vars.css

          nix build .#palette-json --out-link result-palette-json
          cp -L result-palette-json dist/flatwork-palette.json

          nix build .#all-theme-files --out-link result-theme-files
          tar -czf dist/flatwork-theme-files.tar.gz -C result-theme-files .

          nix build .#wallpapers --out-link result-wallpapers
          tar -czf dist/flatwork-wallpapers.tar.gz -C result-wallpapers .

          nix build .#theme-flatwork-saas --out-link result-theme-flatwork-saas
          tar -czf dist/flatwork-saas.tar.gz -C result-theme-flatwork-saas .

          # React package, versioned from the tag (v0.2.0 -> 0.2.0).
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version -w @flatwork-ui/react
          npm pack -w @flatwork-ui/react --pack-destination dist

          nix build .#release-bundle --out-link result-release-bundle
          cp -L result-release-bundle "dist/flatwork-ui-${GITHUB_REF_NAME}.tar.gz"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/flatwork-vars.css
            dist/flatwork-palette.json
            dist/flatwork-theme-files.tar.gz
            dist/flatwork-wallpapers.tar.gz
            dist/flatwork-ui-${{ github.ref_name }}.tar.gz
            dist/flatwork-saas.tar.gz
            dist/flatwork-ui-react-*.tgz

      # Publishes to npmjs.com only when the NPM_TOKEN secret exists; the
      # GitHub release tarball above works without any registry.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish dist/flatwork-ui-react-*.tgz --access public
